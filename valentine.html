<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        body {
            background-color: pink;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        .button {
            padding: 10px 20px;
            font-size: 20px;
            color: white;
            background-color: red;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            animation: move 2s infinite alternate;
            margin: 10px;
        }
        @keyframes move {
            0% { top: 0; }
            100% { top: -20px; }
        }
    </style>
</head>
<body>

<h1>Happy Valentine's Day!</h1>
<button class="button">Be Mine</button>
<button class="button">Sweetheart</button>

</body>
</html>
